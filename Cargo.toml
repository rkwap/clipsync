[package]
name = "clipsync"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Share copies between your Macs and Linux machines on the same network"
license = "MIT"
# Also used by `clipsync update` to find releases.
repository = "https://github.com/rkwap/clipsync"
readme = "README.md"
keywords = ["clipboard", "sync", "macos", "linux", "mdns"]
categories = ["command-line-utilities"]

[dependencies]
blake3 = { version = "1.8", features = ["pure"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4", features = ["std"] }
libc = "0.2.190"
mdns-sd = { version = "0.21.5", default-features = false }
snow = { version = "0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
spake2 = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", default-features = false, features = ["xfixes"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSBitmapImageRep", "NSImageRep"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
